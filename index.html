<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculus Atlas — a learning notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16263f;
    --navy-soft:#243a5a;
    --paper:#faf7ef;
    --paper-2:#f3eee1;
    --orange:#e8743b;      /* derivative */
    --orange-soft:#f6c9ad;
    --green:#3f7d54;       /* integral */
    --green-soft:#bcd9c6;
    --ink:#1b2330;
    --ink-soft:#5b6577;
    --rule:#c9c0ad;
    --grid-minor:rgba(22,38,63,0.045);
    --grid-major:rgba(22,38,63,0.09);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Source Serif 4",Georgia,serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid-minor) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px),
      linear-gradient(var(--grid-major) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-major) 1px,transparent 1px);
    background-size:4px 4px,4px 4px,40px 40px,40px 40px;
    background-position:-1px -1px;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh}

  /* ---------- Header ---------- */
  header.bar{
    background:var(--navy);
    color:var(--paper);
    display:flex;align-items:center;gap:18px;
    padding:12px 22px;
    border-bottom:3px solid var(--orange);
  }
  header.bar .brand{display:flex;align-items:baseline;gap:10px}
  header.bar .mark{
    font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:20px;letter-spacing:.2px;
  }
  header.bar .mark b{color:var(--orange)}
  header.bar .mark i{color:var(--green);font-style:normal}
  header.bar .tag{font-size:12.5px;opacity:.7;font-style:italic}
  header.bar .spacer{flex:1}
  header.bar .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    font-family:"Space Grotesk",sans-serif;font-size:13px;font-weight:500;
    border:1px solid rgba(250,247,239,.28);background:transparent;color:var(--paper);
    padding:7px 12px;border-radius:6px;cursor:pointer;letter-spacing:.2px;
    transition:.15s ease;
  }
  .btn:hover{background:rgba(250,247,239,.12);border-color:rgba(250,247,239,.5)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#1c1208}
  .btn.primary:hover{background:#f3854d}
  .btn.ghost-dark{border-color:rgba(22,38,63,.22);color:var(--navy);background:rgba(255,255,255,.5)}
  .btn.ghost-dark:hover{background:#fff}

  /* ---------- Layout ---------- */
  main.cols{display:grid;grid-template-columns:300px 1fr;min-height:0;overflow:hidden}
  aside.nav{
    background:rgba(22,38,63,.97);
    color:var(--paper);
    border-right:1px solid #0c1424;
    display:flex;flex-direction:column;min-height:0;
  }
  aside.nav .nav-head{
    padding:14px 16px 8px;font-family:"Space Grotesk",sans-serif;font-size:11px;
    letter-spacing:1.6px;text-transform:uppercase;opacity:.6;
  }
  aside.nav .tree-scroll{flex:1;overflow:auto;padding:4px 6px 16px}
  section.reader{overflow:auto;padding:34px 48px 80px}

  /* ---------- Tree ---------- */
  .tree-node{}
  .tree-row{
    display:flex;align-items:center;gap:4px;
    padding:5px 8px;border-radius:6px;cursor:pointer;font-size:14px;
    color:#e7e2d3;font-family:"Space Grotesk",sans-serif;
  }
  .tree-row:hover{background:rgba(250,247,239,.07)}
  .tree-row.selected{background:rgba(232,116,59,.18);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
  .tree-row .chevron{
    width:16px;text-align:center;font-size:11px;opacity:.8;flex:0 0 auto;user-select:none;
  }
  .tree-row .chevron.hidden{visibility:hidden}
  .tree-row .label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tree-row .dot{
    width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-right:4px;
    background:var(--green-soft);
  }
  .tree-row.has-children .dot{background:var(--orange-soft)}
  .tree-children{}

  .nav-foot{
    display:flex;gap:6px;padding:10px 12px;border-top:1px solid rgba(250,247,239,.1);
  }

  /* ---------- Reader ---------- */
  .empty-state{
    max-width:620px;margin:8vh auto;text-align:center;color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:26px;color:var(--navy);
    margin-bottom:10px;
  }
  .empty-state svg{margin-bottom:18px}

  article.concept{max-width:760px;margin:0 auto}
  .crumb{
    font-family:"Space Grotesk",sans-serif;font-size:11.5px;letter-spacing:1px;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px;
  }
  .crumb .sep{opacity:.4;margin:0 7px}
  .crumb .here{color:var(--orange);font-weight:600}

  h1.title{
    font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:38px;line-height:1.08;
    color:var(--navy);margin:0 0 6px;letter-spacing:-.4px;
  }
  .title:focus,.lead:focus,.concept-body:focus{outline:none}
  .title[contenteditable=true]:focus,.lead[contenteditable=true]:focus,.concept-body[contenteditable=true]:focus{
    box-shadow:inset 4px 0 0 var(--green);background:rgba(63,125,84,.05);
  }

  .figure{
    margin:24px 0 10px;background:#fff;border:1px solid var(--rule);
    border-radius:8px;overflow:hidden;position:relative;
    box-shadow:0 1px 0 rgba(22,38,63,.04);
  }
  .figure img{display:block;width:100%;max-height:340px;object-fit:cover;background:var(--paper-2)}
  .figure .dropzone{
    min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--ink-soft);background:
      repeating-linear-gradient(45deg,rgba(22,38,63,.03) 0 10px,transparent 10px 20px);
    cursor:pointer;text-align:center;padding:24px;
  }
  .figure .dropzone.dragover{background:rgba(232,116,59,.12);color:var(--orange)}
  .figure .dropzone .dz-title{font-family:"Space Grotesk",sans-serif;font-weight:500;color:var(--navy);font-size:15px}
  .figure .dropzone .dz-sub{font-size:13px}
  .figure .img-tools{
    position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:.15s;
  }
  .figure:hover .img-tools{opacity:1}
  .img-tools .mini{
    font-family:"Space Grotesk",sans-serif;font-size:11px;background:var(--navy);color:var(--paper);
    border:none;padding:5px 9px;border-radius:5px;cursor:pointer;
  }
  .img-tools .mini:hover{background:var(--navy-soft)}
  .img-tools .mini.danger:hover{background:var(--orange)}

  .lead{
    font-family:"Source Serif 4",serif;font-style:italic;font-size:19px;line-height:1.5;
    color:var(--navy-soft);margin:18px 0 24px;padding-left:14px;border-left:3px solid var(--orange);
  }
  .section-label{
    font-family:"Space Grotesk",sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--green);font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--rule)}
  .concept-body{
    font-size:16.5px;line-height:1.72;color:var(--ink);
  }
  .concept-body p{margin:0 0 14px}
  .concept-body code{
    font-family:"JetBrains Mono",monospace;font-size:13.5px;background:var(--paper-2);
    padding:1px 6px;border-radius:4px;color:var(--navy);border:1px solid var(--rule);
  }
  .concept-body pre{
    font-family:"JetBrains Mono",monospace;font-size:13.5px;line-height:1.6;
    background:#10203a;color:#e7e2d3;padding:16px 18px;border-radius:8px;overflow:auto;
    border-left:3px solid var(--green);margin:0 0 18px;
  }
  .concept-body pre code{background:none;border:none;color:inherit;padding:0}
  .concept-body h3{
    font-family:"Space Grotesk",sans-serif;font-size:17px;color:var(--navy);margin:22px 0 8px;font-weight:600;
  }

  .reader-foot{
    margin-top:34px;padding-top:16px;border-top:1px dashed var(--rule);
    display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
  }
  .hint{
    font-family:"Space Grotesk",sans-serif;font-size:11.5px;color:var(--ink-soft);
    margin-right:auto;align-self:center;
  }
  .hint kbd{
    background:#fff;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;
    padding:1px 6px;font-family:"JetBrains Mono",monospace;font-size:11px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(12,20,36,.5);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.show{display:flex}
  .modal{
    background:var(--paper);border-radius:12px;max-width:440px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;
    border:1px solid var(--rule);
  }
  .modal .m-head{
    background:var(--navy);color:var(--paper);padding:14px 20px;
    font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:16px;
    display:flex;align-items:center;gap:10px;
  }
  .modal .m-head .badge{
    width:8px;height:8px;border-radius:50%;background:var(--orange);
  }
  .modal .m-body{padding:22px 20px}
  .modal .m-body p{margin:0 0 16px;font-size:15px;line-height:1.5;color:var(--ink)}
  .modal .m-body strong{color:var(--navy)}
  .field{margin-bottom:14px}
  .field label{
    display:block;font-family:"Space Grotesk",sans-serif;font-size:11px;letter-spacing:1px;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;
  }
  .field input,.field select,.field textarea{
    width:100%;font-family:"Source Serif 4",serif;font-size:15px;padding:9px 11px;
    border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,116,59,.18);
  }
  .field textarea{min-height:70px;resize:vertical;font-family:"Source Serif 4",serif}
  .m-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px}
  .btn.yes{background:var(--green);border-color:var(--green);color:#fff}
  .btn.yes.danger{background:var(--orange);border-color:var(--orange);color:#1c1208}
  .btn.no{border-color:var(--rule);color:var(--navy);background:#fff}
  .btn.no:hover{background:var(--paper-2)}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:var(--paper);font-family:"Space Grotesk",sans-serif;
    font-size:13px;padding:10px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:.25s;z-index:60;border-left:3px solid var(--green);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(22,38,63,.2);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(22,38,63,.35)}
  aside.nav ::-webkit-scrollbar-thumb{background:rgba(250,247,239,.18)}

  @media (max-width:820px){
    main.cols{grid-template-columns:1fr}
    aside.nav{position:fixed;inset:0 auto 0 0;width:280px;z-index:40;transform:translateX(-100%);transition:.2s}
    aside.nav.open{transform:none}
    section.reader{padding:22px 18px 60px}
    h1.title{font-size:30px}
  }
</style>
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/A665E192-6AF3-6148-A6B9-26270AF52919/main.js" charset="UTF-8"></script></head>
<body>
<div class="app">

  <!-- ===================== HEADER ===================== -->
  <header class="bar">
    <div class="brand">
      <span class="mark">Calculus<b>·d/dx</b><i>∫</i> Atlas</span>
      <span class="tag">a rigorous, beautiful notebook for continuous learning</span>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <button class="btn" id="btn-import" title="Load a concept tree from a .json file">Import tree</button>
      <button class="btn" id="btn-export" title="Save the current tree as a .json file">Export tree</button>
      <button class="btn primary" id="btn-add-top">+ Add concept</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </header>

  <!-- ===================== COLUMNS ===================== -->
  <main class="cols">

    <!-- LEFT: tree navigation -->
    <aside class="nav" id="nav">
      <div class="nav-head">Concepts</div>
      <div class="tree-scroll">
        <div id="tree-root"></div>
      </div>
      <div class="nav-foot">
        <button class="btn ghost-dark" id="btn-add-here" style="flex:1">+ Add here</button>
        <button class="btn ghost-dark" id="btn-collapse-all" title="Collapse all branches">⤢</button>
      </div>
    </aside>

    <!-- RIGHT: concept reader -->
    <section class="reader" id="reader">
      <!-- rendered by JS -->
    </section>
  </main>
</div>

<!-- ===================== MODAL ===================== -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   Calculus Atlas — single-file concept notebook
   State: a nested tree of concepts, persisted in localStorage.
   ============================================================ */

const STORAGE = {
  tree: 'calc-atlas-tree',
  expand: 'calc-atlas-expanded',
  selected: 'calc-atlas-selected'
};

let state = { tree: [], expanded: {}, selectedId: null, seq: 1 };

function uid(){
  return 'c' + (state.seq++) + Math.random().toString(36).slice(2,6);
}

/* ---------- persistence ---------- */
function load(){
  let firstRun = false;
  try{
    const raw = localStorage.getItem(STORAGE.tree);
    if(raw){
      const p = JSON.parse(raw);
      state.tree = p.tree || [];
      state.seq  = p.seq || 1;
    } else {
      firstRun = true;
    }
  }catch(e){
    firstRun = true;
  }
  if(firstRun){
    // seed() also seeds state.expanded + state.selectedId as side effects;
    // keep them — do NOT clobber by re-reading (empty) localStorage below.
    state.tree = seed();
  } else {
    try{ state.expanded = JSON.parse(localStorage.getItem(STORAGE.expand) || '{}'); }
    catch(e){ state.expanded = {}; }
    state.selectedId = localStorage.getItem(STORAGE.selected) || null;
  }
}
// Safety net: drop a stale selection, default to the first node, and make
// sure the path to the selected node is expanded so it is visible.
function normalizeState(){
  if(state.selectedId && !findNode(state.selectedId)) state.selectedId = null;
  if(!state.selectedId && state.tree.length){
    state.selectedId = state.tree[0].id;
  }
  if(state.selectedId){
    const path = pathTo(state.selectedId) || [];
    path.forEach(p => { state.expanded[p.id] = true; });
  }
}
function save(){
  try{
    localStorage.setItem(STORAGE.tree, JSON.stringify({tree:state.tree, seq:state.seq}));
    localStorage.setItem(STORAGE.expand, JSON.stringify(state.expanded));
    localStorage.setItem(STORAGE.selected, state.selectedId || '');
  }catch(e){ toast('Storage full — large images may not persist.'); }
}

/* ---------- tree helpers ---------- */
function findNode(id, nodes){
  nodes = nodes || state.tree;
  for(const n of nodes){
    if(n.id === id) return n;
    if(n.children){ const f = findNode(id, n.children); if(f) return f; }
  }
  return null;
}
function findParentList(id, nodes){
  nodes = nodes || state.tree;
  for(const n of nodes){
    if(n.id === id) return nodes;
    if(n.children){ const f = findParentList(id, n.children); if(f) return f; }
  }
  return null;
}
function pathTo(id, nodes, acc){
  nodes = nodes || state.tree; acc = acc || [];
  for(const n of nodes){
    if(n.id === id) return acc.concat([n]);
    if(n.children){
      const p = pathTo(id, n.children, acc.concat([n]));
      if(p) return p;
    }
  }
  return null;
}
function removeNode(id){
  const list = findParentList(id);
  if(!list) return false;
  const i = list.findIndex(n => n.id === id);
  if(i === -1) return false;
  list.splice(i,1);
  return true;
}
function flattenIds(nodes, acc){
  nodes = nodes || state.tree; acc = acc || [];
  for(const n of nodes){ acc.push(n.id); if(n.children) flattenIds(n.children, acc); }
  return acc;
}

/* ---------- SVG helpers for seed diagrams ---------- */
function svgDataUri(svg){
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}
function tangentSVG(){
  return svgDataUri(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 200'>"+
    "<rect width='360' height='200' fill='#faf7ef'/>"+
    "<line x1='30' y1='170' x2='340' y2='170' stroke='#16263f' stroke-width='1.2'/>"+
    "<line x1='30' y1='20' x2='30' y2='170' stroke='#16263f' stroke-width='1.2'/>"+
    "<path d='M40 165 Q 180 30 330 70' stroke='#16263f' fill='none' stroke-width='2.2'/>"+
    "<line x1='70' y1='185' x2='300' y2='25' stroke='#e8743b' stroke-width='2.4'/>"+
    "<circle cx='180' cy='95' r='4.5' fill='#e8743b'/>"+
    "<text x='186' y='92' font-family='monospace' font-size='11' fill='#16263f'>P</text>"+
    "<text x='250' y='40' font-family='monospace' font-size='11' fill='#e8743b'>tangent</text>"+
    "</svg>");
}
function integralSVG(){
  return svgDataUri(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 200'>"+
    "<rect width='360' height='200' fill='#faf7ef'/>"+
    "<line x1='30' y1='170' x2='340' y2='170' stroke='#16263f' stroke-width='1.2'/>"+
    "<line x1='30' y1='20' x2='30' y2='170' stroke='#16263f' stroke-width='1.2'/>"+
    "<path d='M70 150 C 130 40, 250 40, 320 150 L 320 170 L 70 170 Z' fill='#3f7d54' fill-opacity='0.32' stroke='#3f7d54' stroke-width='2'/>"+
    "<line x1='70' y1='150' x2='320' y2='150' stroke='#3f7d54' stroke-width='1.4' stroke-dasharray='4 3'/>"+
    "<text x='160' y='165' font-family='monospace' font-size='11' fill='#3f7d54'>area = ∫f</text>"+
    "</svg>");
}
function limitSVG(){
  return svgDataUri(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 200'>"+
    "<rect width='360' height='200' fill='#faf7ef'/>"+
    "<line x1='30' y1='170' x2='340' y2='170' stroke='#16263f' stroke-width='1.2'/>"+
    "<line x1='30' y1='20' x2='30' y2='170' stroke='#16263f' stroke-width='1.2'/>"+
    "<path d='M40 165 Q 120 30 175 95 Q 230 165 335 35' stroke='#16263f' fill='none' stroke-width='2.2'/>"+
    "<circle cx='175' cy='95' r='5' fill='#faf7ef' stroke='#e8743b' stroke-width='2.4'/>"+
    "<line x1='175' y1='95' x2='175' y2='25' stroke='#e8743b' stroke-width='1.4' stroke-dasharray='3 3'/>"+
    "<text x='120' y='18' font-family='monospace' font-size='11' fill='#e8743b'>L = lim f(x)</text>"+
    "</svg>");
}

/* ---------- seed content ---------- */
function seed(){
  const calc    = { id:uid(), title:'Calculus',
    image:'', description:'The mathematics of continuous change — the two operations, differentiation and integration, that are inverse to one another.',
    concept:"<p>Calculus is the study of <strong>continuous change</strong>, in the same way that geometry is the study of shape and algebra is the study of generalised arithmetic. It rests on two complementary operations:</p><p><code>d/dx</code> — the <em>derivative</em>, which measures instantaneous rate of change; and <code>∫</code> — the <em>integral</em>, which accumulates quantities. The two are undone by one another, a fact made precise by the Fundamental Theorem.</p><h3>Why it matters</h3><p>Wherever a quantity varies smoothly — position, temperature, charge, probability density — calculus supplies the language to reason about it. The tree on the left organises the subject from limits upward.</p>",
    children:[] };

  const limits  = { id:uid(), title:'Limits & Continuity', image:limitSVG(),
    description:'The limit formalises the idea of a value approached but not necessarily reached.',
    concept:"<p>A <strong>limit</strong> asks what value a function <code>f(x)</code> tends toward as <code>x</code> approaches a point <code>a</code> — whether or not <code>f</code> is even defined there. Everything else in calculus is built on this single idea.</p><pre><code>lim x→a  f(x) = L\n means: for every ε > 0 there is a δ > 0\n such that 0 < |x − a| < δ  ⇒  |f(x) − L| < ε</code></pre><p>The ε–δ definition above is what makes the informal notion of 'approaching' rigorous.</p>",
    children:[] };
  const limDef  = { id:uid(), title:'The Limit', image:'',
    description:'A value approached arbitrarily closely as the input tends to a point.',
    concept:"<p>Read <code>lim_{x→a} f(x) = L</code> as: <em>f</em> can be made to lie as close as we please to <em>L</em> by choosing <em>x</em> sufficiently close to <em>a</em> (but not equal to <em>a</em>).</p><h3>One-sided limits</h3><p>The left limit <code>x→a⁻</code> and right limit <code>x→a⁺</code> must agree for the two-sided limit to exist. A jump discontinuity is exactly a place where they disagree.</p>", children:[] };
  const cont    = { id:uid(), title:'Continuity', image:'',
    description:'A function is continuous where its limit equals its value.',
    concept:"<p><code>f</code> is continuous at <code>a</code> precisely when</p><pre><code>lim_{x→a} f(x) = f(a)</code></pre><p>three conditions in one: <em>f(a)</em> exists, the limit exists, and they are equal. Break any one and continuity fails.</p>", children:[] };
  limits.children = [limDef, cont];

  const derivs  = { id:uid(), title:'Derivatives', image:tangentSVG(),
    description:'The derivative is the slope of the tangent — the instantaneous rate of change.',
    concept:"<p>The derivative of <code>f</code> at <code>x</code> is the slope of its tangent line there:</p><pre><code>f'(x) = lim_{h→0}  ( f(x+h) − f(x) ) / h</code></pre><p>Geometrically, it is the limit of secant slopes as the two points merge into one. The orange line in the figure is that tangent.</p><h3>Notation</h3><p>Leibniz wrote <code>dy/dx</code>; Lagrange wrote <code>f'(x)</code>; Newton wrote <code>ẏ</code>. All denote the same object.</p>", children:[] };
  const dDef    = { id:uid(), title:'Definition of the Derivative', image:'',
    description:'The derivative as a limit of difference quotients.',
    concept:"<p>Starting from the average rate of change over an interval of width <code>h</code>:</p><pre><code>Δy/Δx = ( f(x+h) − f(x) ) / h</code></pre><p>the derivative is what survives in the limit as <code>h → 0</code>. If that limit exists, <code>f</code> is <em>differentiable</em> at <code>x</code>.</p>", children:[] };
  const dRules  = { id:uid(), title:'Rules of Differentiation', image:'',
    description:'Shortcuts that spare us computing the limit every time.',
    concept:"<p>Once the definition is in hand, a small algebra of rules covers almost every function:</p><pre><code>(c)'            = 0\n(x^n)'         = n·x^(n−1)\n(u + v)'       = u' + v'\n(u · v)'       = u'v + uv'    (product)\n(u / v)'       = (u'v − uv') / v²   (quotient)\n(f∘g)'        = f'(g(x))·g'(x)   (chain)</code></pre><p>The <strong>chain rule</strong> is the one to internalise — it governs every composite function.</p>", children:[] };
  derivs.children = [dDef, dRules];

  const integ   = { id:uid(), title:'Integrals', image:integralSVG(),
    description:'The integral accumulates a quantity — geometrically, area under a curve.',
    concept:"<p>The <strong>definite integral</code></strong> of <code>f</code> from <code>a</code> to <code>b</code> is the signed area between the graph and the axis:</p><pre><code>∫_a^b f(x) dx  =  lim_{n→∞} Σ f(x_i*) Δx</code></pre><p>It is a limit of Riemann sums — finer and finer rectangles whose total tends to a definite number.</p>", children:[] };
  const iDef    = { id:uid(), title:'The Definite Integral', image:'',
    description:'A limit of Riemann sums yielding signed area.',
    concept:"<p>Partition <code>[a,b]</code> into <code>n</code> strips of width <code>Δx = (b−a)/n</code>, sample one point <code>x_i*</code> in each, and sum <code>f(x_i*)·Δx</code>. As <code>n → ∞</code> the sum converges (for integrable <code>f</code>) to the integral.</p>", children:[] };
  const iFTC    = { id:uid(), title:'Fundamental Theorem', image:'',
    description:'Differentiation and integration are inverse operations.',
    concept:"<p>The theorem has two halves, and both are surprising:</p><pre><code>(1)  d/dx ∫_a^x f(t) dt  =  f(x)\n(2)  ∫_a^b F'(x) dx      =  F(b) − F(a)</code></pre><p>The first says an integral is an antiderivative; the second turns integration into evaluation at the endpoints. Together they bind the two halves of calculus into one.</p>", children:[] };
  integ.children = [iDef, iFTC];

  calc.children = [limits, derivs, integ];

  // expand the spine by default
  [calc.id, limits.id, derivs.id, integ.id].forEach(id => state.expanded[id] = true);
  state.selectedId = derivs.id;
  return [calc];
}

/* ============================================================
   RENDER — tree
   ============================================================ */
function renderTree(){
  const root = document.getElementById('tree-root');
  root.innerHTML = '';
  if(state.tree.length === 0){
    root.innerHTML = '<div style="padding:18px 12px;color:#b9b2a0;font-family:Space Grotesk,sans-serif;font-size:13px">No concepts yet. Use <strong>+ Add concept</strong> to begin.</div>';
    return;
  }
  state.tree.forEach(n => root.appendChild(renderNode(n, 0)));
}
function renderNode(node, depth){
  const wrap = document.createElement('div');
  wrap.className = 'tree-node';
  const hasKids = node.children && node.children.length > 0;
  const isOpen = !!state.expanded[node.id];
  const row = document.createElement('div');
  row.className = 'tree-row' + (hasKids ? ' has-children' : '') + (state.selectedId === node.id ? ' selected' : '');
  row.style.paddingLeft = (10 + depth * 16) + 'px';

  const chev = document.createElement('span');
  chev.className = 'chevron' + (hasKids ? '' : ' hidden');
  chev.textContent = hasKids ? (isOpen ? '▾' : '▸') : '';
  chev.onclick = function(e){ e.stopPropagation(); toggleExpand(node.id); };
  row.appendChild(chev);

  const dot = document.createElement('span');
  dot.className = 'dot';
  row.appendChild(dot);

  const lab = document.createElement('span');
  lab.className = 'label';
  lab.textContent = node.title || '(untitled)';
  lab.onclick = function(){ selectConcept(node.id); };
  row.appendChild(lab);

  wrap.appendChild(row);

  if(hasKids && isOpen){
    const cw = document.createElement('div');
    cw.className = 'tree-children';
    node.children.forEach(c => cw.appendChild(renderNode(c, depth + 1)));
    wrap.appendChild(cw);
  }
  return wrap;
}
function toggleExpand(id){
  state.expanded[id] = !state.expanded[id];
  save(); renderTree();
}

/* ============================================================
   RENDER — reader
   ============================================================ */
function renderReader(){
  const r = document.getElementById('reader');
  const node = state.selectedId ? findNode(state.selectedId) : null;

  if(!node){
    r.innerHTML = emptyStateHTML();
    return;
  }
  const path = pathTo(node.id) || [];
  const crumbs = path.map((p,i) => {
    const last = i === path.length - 1;
    return last
      ? '<span class="here">'+escapeHTML(p.title)+'</span>'
      : '<span>'+escapeHTML(p.title)+'</span><span class="sep">/</span>';
  }).join('');

  const imgBlock = node.image
    ? '<div class="figure">'
        + '<img src="'+node.image+'" alt="figure for '+escapeAttr(node.title)+'">'
        + '<div class="img-tools">'
          + '<button class="mini" data-act="replace-img">Replace</button>'
          + '<button class="mini danger" data-act="remove-img">Remove</button>'
        + '</div></div>'
    : '<div class="figure"><div class="dropzone" data-act="add-img">'
        + '<div class="dz-title">Drop an image here, or click to choose</div>'
        + '<div class="dz-sub">PNG · JPG · SVG · GIF — stored locally in your browser</div>'
      + '</div></div>';

  r.innerHTML =
    '<article class="concept">'+
      '<div class="crumb">'+crumbs+'</div>'+
      '<h1 class="title" contenteditable="true" spellcheck="false" data-field="title">'+escapeHTML(node.title)+'</h1>'+
      imgBlock+
      '<div class="section-label">Quick description</div>'+
      '<div class="lead" contenteditable="true" spellcheck="false" data-field="description">'+escapeHTML(node.description||'')+'</div>'+
      '<div class="section-label">Concept</div>'+
      '<div class="concept-body" contenteditable="true" spellcheck="false" data-field="concept">'+(node.concept||'<p>Write the concept here…</p>')+'</div>'+
      '<div class="reader-foot">'+
        '<span class="hint">Click any text to edit · <kbd>Ctrl</kbd>+<kbd>S</kbd> saves · images persist locally</span>'+
        '<button class="btn no" data-act="add-child">+ Sub-concept</button>'+
        '<button class="btn no danger" data-act="remove">Remove concept</button>'+
      '</div>'+
    '</article>';

  bindReader(node);
}

function emptyStateHTML(){
  return '<div class="empty-state">'+
    '<svg width="84" height="84" viewBox="0 0 84 84" fill="none">'+
      '<rect x="6" y="6" width="72" height="72" rx="10" fill="none" stroke="#16263f" stroke-width="2"/>'+
      '<path d="M18 60 Q 42 18 66 36" stroke="#16263f" stroke-width="2" fill="none"/>'+
      '<line x1="20" y1="66" x2="64" y2="22" stroke="#e8743b" stroke-width="2.4"/>'+
      '<circle cx="42" cy="38" r="4" fill="#e8743b"/>'+
    '</svg>'+
    '<div class="big">Pick a concept on the left</div>'+
    '<p>Or create a new one. Everything you write — text and images — is saved in this browser only. Use <strong>Export tree</strong> to back it up or move it to another machine as a single <code>.json</code> file.</p>'+
  '</div>';
}

function bindReader(node){
  // editable fields -> persist
  r().querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('blur', () => {
      const f = el.getAttribute('data-field');
      const v = el.innerHTML;
      if(f === 'title'){
        node.title = el.textContent;
        renderTree();
      } else {
        node[f] = v;
      }
      save();
    });
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && el.getAttribute('data-field') === 'title'){
        e.preventDefault(); el.blur();
      }
    });
  });

  // action buttons
  r().querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', (e) => {
      const act = el.getAttribute('data-act');
      if(act === 'remove') confirmRemove(node);
      else if(act === 'add-child') openAddModal(node.id);
      else if(act === 'add-img') triggerImagePicker(node);
      else if(act === 'replace-img') triggerImagePicker(node);
      else if(act === 'remove-img') confirmRemoveImage(node);
    });
  });

  // drag-drop onto dropzone
  const dz = r().querySelector('.dropzone');
  if(dz){
    ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('dragover'); }));
    dz.addEventListener('drop', e => {
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) readImage(f, node);
    });
  }
}
function r(){ return document.getElementById('reader'); }

/* ---------- image ---------- */
let _pickerTarget = null;
function triggerImagePicker(node){
  _pickerTarget = node;
  const input = document.getElementById('import-file');
  // reuse a dedicated image input instead
  let imgInput = document.getElementById('image-file');
  if(!imgInput){
    imgInput = document.createElement('input');
    imgInput.type = 'file'; imgInput.accept = 'image/*'; imgInput.hidden = true; imgInput.id = 'image-file';
    document.body.appendChild(imgInput);
    imgInput.addEventListener('change', () => {
      if(imgInput.files[0] && _pickerTarget) readImage(imgInput.files[0], _pickerTarget);
      imgInput.value = '';
    });
  }
  imgInput.click();
}
function readImage(file, node){
  if(!file.type.startsWith('image/')){ toast('That file is not an image.'); return; }
  if(file.size > 2.2 * 1024 * 1024){ toast('Image is large (>2MB) — may not persist locally.'); }
  const reader = new FileReader();
  reader.onload = () => {
    node.image = reader.result;       // data URI
    save(); renderReader(); toast('Image added.');
  };
  reader.onerror = () => toast('Could not read that image.');
  reader.readAsDataURL(file);
}
function confirmRemoveImage(node){
  openConfirm({
    title:'Remove image',
    badge:true,
    body:'<p>Remove the image from <strong>'+escapeHTML(node.title)+'</strong>? The text is kept; only the picture is deleted.</p>',
    yesLabel:'Remove',
    yesDanger:true,
    onYes: () => { node.image = ''; save(); renderReader(); toast('Image removed.'); }
  });
}

/* ============================================================
   ADD / REMOVE
   ============================================================ */
function selectConcept(id){
  state.selectedId = id;
  state.expanded[id] = true; // reveal selected
  save(); renderTree(); renderReader();
}

function openAddModal(parentId){
  // Build parent options
  const opts = [{id:'__root', title:'(top level)'}];
  (function walk(nodes, depth){
    nodes.forEach(n => {
      opts.push({id:n.id, title:'— '.repeat(depth)+n.title});
      if(n.children) walk(n.children, depth+1);
    });
  })(state.tree, 0);
  let preselected = parentId || state.selectedId || '__root';
  if(!findNode(preselected)) preselected = '__root';

  openModal({
    title: parentId ? 'Add a sub-concept' : 'Add a concept',
    badge:true,
    body:
      '<div class="field"><label>Title</label>'+
        '<input id="f-title" type="text" placeholder="e.g. Taylor Series" autofocus></div>'+
      '<div class="field"><label>Parent</label>'+
        '<select id="f-parent">'+opts.map(o =>
          '<option value="'+o.id+'"'+(o.id===preselected?' selected':'')+'>'+escapeHTML(o.title)+'</option>'
        ).join('')+'</select></div>'+
      '<div class="field"><label>Quick description (optional)</label>'+
        '<textarea id="f-desc" placeholder="A one-line summary"></textarea></div>'+
      '<p style="font-size:12.5px;color:#5b6577;font-style:italic">You can fill in the concept body and image afterwards in the reader.</p>',
    yesLabel:'Add concept',
    onYes: () => {
      const title = document.getElementById('f-title').value.trim();
      if(!title){ toast('Please enter a title.'); return false; }
      const pid = document.getElementById('f-parent').value;
      const desc = document.getElementById('f-desc').value.trim();
      const node = { id:uid(), title, image:'', description:desc, concept:'<p>Write the concept here…</p>', children:[] };
      let list;
      if(pid === '__root'){ list = state.tree; }
      else {
        const parent = findNode(pid);
        if(!parent){ toast('Parent not found.'); return false; }
        if(!parent.children) parent.children = [];
        list = parent.children;
        state.expanded[pid] = true;
      }
      list.push(node);
      state.selectedId = node.id;
      save(); renderTree(); renderReader();
      toast('Added: '+title);
      return true;
    }
  });
}

function confirmRemove(node){
  const hasKids = node.children && node.children.length > 0;
  const extra = hasKids
    ? ' <strong>and all '+node.children.length+' sub-concepts beneath it</strong>'
    : '';
  const path = pathTo(node.id) || [];
  const parent = path.length >= 2 ? path[path.length - 2] : null;
  openConfirm({
    title:'Remove concept',
    badge:true,
    body:'<p>Remove <strong>'+escapeHTML(node.title)+'</strong>'+extra+'? This cannot be undone.</p>',
    yesLabel:'Remove',
    yesDanger:true,
    onYes: () => {
      removeNode(node.id);
      if(state.selectedId === node.id || !findNode(state.selectedId)){
        // keep the reader populated: prefer the parent, else the first remaining node
        state.selectedId = parent ? parent.id : (state.tree[0] ? state.tree[0].id : null);
      }
      save(); renderTree(); renderReader();
      toast('Removed: '+node.title);
    }
  });
}

/* ============================================================
   IMPORT / EXPORT  (the "folder addition" path for a static page)
   ============================================================ */
function exportTree(){
  const data = { app:'calculus-atlas', version:1, exportedAt:new Date().toISOString(), tree:state.tree };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'calculus-atlas-tree.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Tree exported.');
}
function importTree(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast('That file is not valid JSON.'); return; }
    const incoming = Array.isArray(data) ? data : data.tree;
    if(!Array.isArray(incoming)){ toast('No "tree" array found in the file.'); return; }
    openConfirm({
      title:'Import tree',
      body:'<p>Importing will <strong>replace</strong> your current concept tree with the '+incoming.length+' top-level concept(s) from the file. Continue?</p>',
      yesLabel:'Replace & import',
      onYes: () => {
        // re-id to avoid collisions and reset seq
        state.seq = 1;
        (function reid(nodes){
          nodes.forEach(n => {
            n.id = uid();
            if(n.children) reid(n.children);
          });
        })(incoming);
        state.tree = incoming;
        state.expanded = {};
        flattenIds().slice(0, 6).forEach(id => state.expanded[id] = true);
        state.selectedId = flattenIds()[0] || null;
        save(); renderTree(); renderReader();
        toast('Tree imported.');
        return true;
      }
    });
  };
  reader.readAsText(file);
}

/* ============================================================
   MODAL ENGINE (custom yes/no — no native confirm())
   ============================================================ */
function openModal(opts){
  const ov = document.getElementById('overlay');
  const m = document.getElementById('modal');
  const yesLabel = opts.yesLabel || 'Yes';
  const noLabel = opts.noLabel || 'No';
  m.innerHTML =
    '<div class="m-head">'+(opts.badge?'<span class="badge"></span>':'')+escapeHTML(opts.title||'Confirm')+'</div>'+
    '<div class="m-body">'+(opts.body||'')+'</div>'+
    '<div class="m-foot">'+
      '<button class="btn no" data-act="no">'+escapeHTML(noLabel)+'</button>'+
      '<button class="btn yes'+(opts.yesDanger?' danger':'')+'" data-act="yes">'+escapeHTML(yesLabel)+'</button>'+
    '</div>';
  ov.classList.add('show');
  const close = () => ov.classList.remove('show');
  const yes = m.querySelector('[data-act="yes"]');
  const no  = m.querySelector('[data-act="no"]');
  yes.onclick = () => {
    if(opts.onYes){ const r = opts.onYes(); if(r === false) return; }
    close();
  };
  no.onclick = () => { if(opts.onNo) opts.onNo(); close(); };
  ov.onclick = (e) => { if(e.target === ov){ if(opts.onNo) opts.onNo(); close(); } };
  // autofocus
  setTimeout(() => {
    const af = m.querySelector('[autofocus]');
    if(af) af.focus();
    else yes.focus();
  }, 30);
}
function openConfirm(opts){ return openModal(Object.assign({yesLabel:'Yes', noLabel:'No'}, opts)); }

/* ---------- toast ---------- */
let _toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- escape helpers ---------- */
function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHTML(s); }

/* ============================================================
   WIRE UP
   ============================================================ */
function collapseAll(){
  state.expanded = {};
  // keep selected branch visible
  if(state.selectedId){
    const path = pathTo(state.selectedId) || [];
    path.forEach(p => state.expanded[p.id] = true);
  }
  save(); renderTree();
}

document.getElementById('btn-add-top').addEventListener('click', () => openAddModal(null));
document.getElementById('btn-add-here').addEventListener('click', () => {
  openAddModal(state.selectedId || null);
});
document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
document.getElementById('btn-export').addEventListener('click', exportTree);
document.getElementById('btn-import').addEventListener('click', () => document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', (e) => {
  if(e.target.files[0]) importTree(e.target.files[0]);
  e.target.value = '';
});

// Ctrl/Cmd+S to flush save (already auto-saved, but reassures the user)
document.addEventListener('keydown', (e) => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault(); save(); toast('Saved.');
  }
  if(e.key === 'Escape'){
    document.getElementById('overlay').classList.remove('show');
  }
});

// init
load();
normalizeState();
renderTree();
renderReader();
save();
</script>
